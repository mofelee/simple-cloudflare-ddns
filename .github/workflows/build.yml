name: Build and publish

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

  binaries:
    name: Binary ${{ matrix.os }}/${{ matrix.arch }}${{ matrix.name_suffix }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            goarm: ""
            name_suffix: ""
            extension: ""
            archive: tar.gz
          - os: linux
            arch: arm64
            goarm: ""
            name_suffix: ""
            extension: ""
            archive: tar.gz
          - os: linux
            arch: arm
            goarm: "7"
            name_suffix: -v7
            extension: ""
            archive: tar.gz
          - os: darwin
            arch: amd64
            goarm: ""
            name_suffix: ""
            extension: ""
            archive: tar.gz
          - os: darwin
            arch: arm64
            goarm: ""
            name_suffix: ""
            extension: ""
            archive: tar.gz
          - os: windows
            arch: amd64
            goarm: ""
            name_suffix: ""
            extension: .exe
            archive: zip
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Build and package
        shell: bash
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          GOARM: ${{ matrix.goarm }}
          EXTENSION: ${{ matrix.extension }}
          NAME_SUFFIX: ${{ matrix.name_suffix }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          name="simple-cloudflare-ddns-${GOOS}-${GOARCH}${NAME_SUFFIX}"
          mkdir -p "dist/${name}"
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags="-s -w" -o "dist/${name}/simple-cloudflare-ddns${EXTENSION}" .
          if [ "${ARCHIVE}" = "zip" ]; then
            (cd "dist/${name}" && zip -q "../${name}.zip" "simple-cloudflare-ddns${EXTENSION}")
          else
            tar -czf "dist/${name}.tar.gz" -C "dist/${name}" "simple-cloudflare-ddns${EXTENSION}"
          fi
          rm -rf "dist/${name}"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.name_suffix }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > checksums.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --title "${GITHUB_REF_NAME}"
          fi

  image:
    name: Container image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
